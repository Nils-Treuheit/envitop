[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitop"
version = "0.1.0"
description = "A btop-style TUI that unifies system, NVIDIA GPU and AI-agent monitoring"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "omnitop contributors" }]
keywords = ["tui", "monitor", "gpu", "nvidia", "btop", "nvitop", "abtop", "ai-agents"]
dependencies = [
  "textual>=0.80",
  "psutil>=5.9",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
omnitop = "omnitop.cli:main"

[tool.setuptools.packages.find]
include = ["omnitop*"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
